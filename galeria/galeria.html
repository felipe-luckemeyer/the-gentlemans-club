    <!-- conteúdo principal da página da Galeria -->
    <main>
      <script>
        function mostraOutraImagem(id) {
          document.getElementById(id).setAttribute("src", "outra-imagem.jpg");
        }
        function mostraImagemOriginal(id, src) {
          document.getElementById(id).setAttribute("src", src);
        }
      </script>
      <!-- seção com uma colagem de fotos no estilo polaroid -->
      <section>
        <div class="portrait" style="transform: rotate(7deg)">
          <img
            id="img-1"
            onmousedown="mostraOutraImagem('img-1')"
            onmouseup="mostraImagemOriginal('img-1', 'img-galeria-01.jpg')"
            src="img-galeria-01.jpg"
            alt="Ferramentas de barbeiro organizadas em uma bancada de madeira."
          />
        </div>
        <div class="portrait" style="transform: rotate(-5deg)">
          <img
            id="img-2"
            onmousedown="mostraOutraImagem('img-2')"
            onmouseup="mostraImagemOriginal('img-2', 'img-galeria-02.jpg')"
            src="img-galeria-02.jpg"
            alt="Cadeiras de barbeiro clássicas em um salão com estilo vintage."
          />
        </div>
        <div class="portrait" style="transform: rotate(6deg)">
          <img
            id="img-3"
            onmousedown="mostraOutraImagem('img-3')"
            onmouseup="mostraImagemOriginal('img-3', 'img-galeria-03.jpg')"
            src="img-galeria-03.jpg"
            alt="Barbeiro profissional fazendo um corte de cabelo detalhado em um cliente."
          />
        </div>
        <div class="portrait" style="transform: rotate(-4deg)">
          <img
            id="img-4"
            onmousedown="mostraOutraImagem('img-4')"
            onmouseup="mostraImagemOriginal('img-4', 'img-galeria-04.jpg')"
            src="img-galeria-04.jpg"
            alt="Close-up de uma navalha e outros utensílios de barbearia."
          />
        </div>
        <div class="portrait" style="transform: rotate(-4deg)">
          <img
            id="img-5"
            onmousedown="mostraOutraImagem('img-5')"
            onmouseup="mostraImagemOriginal('img-5', 'img-galeria-05.png')"
            src="img-galeria-05.png"
            alt=""
          />
        </div>
        <div class="portrait" style="transform: rotate(6deg)">
          <img
            id="img-6"
            onmousedown="mostraOutraImagem('img-6')"
            onmouseup="mostraImagemOriginal('img-6', 'img-galeria-06.png')"

        <div class="portrait" style="transform: rotate(-5deg)">

            src="img-galeria-08.jpg"
            alt=""

        </div>
